    <!-- TEMPORARY DEBUG OVERLAY - remove once freeze bug is fixed -->
    <script>
      (function () {
        const box = document.createElement('div');
        box.id = 'debug-overlay';
        box.style.cssText = 'position:fixed;bottom:0;left:0;right:0;max-height:45vh;overflow-y:auto;background:black;color:#0f0;font-size:10px;font-family:monospace;padding:8px;z-index:999999;white-space:pre-wrap;';
        document.addEventListener('DOMContentLoaded', () => document.body.appendChild(box));

        function log(msg, color) {
          const line = document.createElement('div');
          line.style.color = color || '#0f0';
          line.textContent = new Date().toLocaleTimeString() + ' — ' + msg;
          box.appendChild(line);
          box.scrollTop = box.scrollHeight;
        }

        window.addEventListener('error', (e) => {
          log('ERROR: ' + e.message + ' (' + e.filename + ':' + e.lineno + ')', 'red');
        });

        window.addEventListener('unhandledrejection', (e) => {
          log('UNHANDLED PROMISE: ' + (e.reason?.message || e.reason), 'orange');
        });

        document.addEventListener('visibilitychange', () => {
          log('visibility changed to: ' + document.visibilityState, 'cyan');
        });

        const origError = console.error;
        console.error = function (...args) {
          log('console.error: ' + args.join(' '), 'red');
          origError.apply(console, args);
        };

        // Track every fetch request: start, finish, and flag if it hangs
        const origFetch = window.fetch;
        let reqId = 0;
        window.fetch = function (...args) {
          const id = ++reqId;
          const url = typeof args[0] === 'string' ? args[0] : (args[0]?.url || 'unknown');
          const shortUrl = url.replace(/^https?:\/\//, '').slice(0, 60);
          const start = Date.now();
          log('#' + id + ' FETCH START: ' + shortUrl, 'yellow');

          const hangWarn = setTimeout(() => {
            log('#' + id + ' STILL PENDING after 8s: ' + shortUrl, 'red');
          }, 8000);

          return origFetch.apply(this, args)
            .then((res) => {
              clearTimeout(hangWarn);
              log('#' + id + ' FETCH DONE (' + res.status + ') in ' + (Date.now() - start) + 'ms: ' + shortUrl, 'lime');
              return res;
            })
            .catch((err) => {
              clearTimeout(hangWarn);
              log('#' + id + ' FETCH FAILED: ' + shortUrl + ' — ' + err.message, 'red');
              throw err;
            });
        };

        // Track WebSocket connections (Supabase realtime uses these)
        const OrigWS = window.WebSocket;
        window.WebSocket = function (...args) {
          const url = args[0];
          const shortUrl = String(url).slice(0, 60);
          log('WEBSOCKET OPEN attempt: ' + shortUrl, 'magenta');
          const ws = new OrigWS(...args);
          ws.addEventListener('open', () => log('WEBSOCKET connected: ' + shortUrl, 'lime'));
          ws.addEventListener('close', (e) => log('WEBSOCKET closed (code ' + e.code + '): ' + shortUrl, 'orange'));
          ws.addEventListener('error', () => log('WEBSOCKET error: ' + shortUrl, 'red'));
          return ws;
        };
        window.WebSocket.prototype = OrigWS.prototype;

        log('Debug overlay active (fetch + websocket tracking on)');
      })();
    </script>
